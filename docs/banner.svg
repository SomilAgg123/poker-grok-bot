<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <radialGradient id="felt" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#23915a"/><stop offset="0.7" stop-color="#0f4a2d"/><stop offset="1" stop-color="#0a3320"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a3a"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
    <pattern id="back" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#1b2f50"/><rect width="5" height="10" fill="#28426b"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.5"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f2c14e" flood-opacity="0.9"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="340" rx="170" fill="#5a3a1e"/>
  <rect x="56" y="46" width="1088" height="308" rx="154" fill="url(#felt)"/>
  <!-- face-down cards (left) -->
  <g filter="url(#sh)">
    <g transform="translate(130,140) rotate(-14)"><rect width="84" height="120" rx="9" fill="url(#back)" stroke="#fff" stroke-width="4"/></g>
    <g transform="translate(175,128) rotate(-4)"><rect width="84" height="120" rx="9" fill="url(#back)" stroke="#fff" stroke-width="4"/></g>
  </g>
  <!-- the Tell card, flipped & glowing -->
  <g transform="translate(232,112) rotate(8)" filter="url(#glow)">
    <rect width="84" height="120" rx="9" fill="#fdfdf8" stroke="#f2c14e" stroke-width="4"/>
    <text x="10" y="30" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#c41d1d">A</text>
    <text x="42" y="88" font-family="Arial,sans-serif" font-size="48" text-anchor="middle" fill="#c41d1d">♥</text>
  </g>
  <text x="274" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#f2c14e" text-anchor="middle">THE TELL</text>
  <!-- title -->
  <text x="640" y="185" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="700" fill="#fff" text-anchor="middle" filter="url(#sh)">Tell <tspan fill="#f2c14e">Hold'em</tspan></text>
  <text x="640" y="238" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#e6f4ea" text-anchor="middle">No-Limit poker where everyone must show you a card.</text>
  <text x="640" y="290" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="middle" letter-spacing="18"><tspan fill="#111">♠</tspan><tspan fill="#c41d1d">♥</tspan><tspan fill="#111">♣</tspan><tspan fill="#c41d1d">♦</tspan></text>
  <!-- chips -->
  <g filter="url(#sh)">
    <circle cx="1060" cy="250" r="30" fill="#c33" stroke="#fff" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="1100" cy="215" r="30" fill="#2b5fb3" stroke="#fff" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="1050" cy="190" r="30" fill="#d9a62a" stroke="#fff" stroke-width="5" stroke-dasharray="10 8"/>
  </g>
</svg>
